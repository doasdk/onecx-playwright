name: Build and publish Playwright runtime

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Validate launcher contracts
        run: |
          node --test tests/*.test.cjs
          sh -n runtime/entrypoint.sh
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build runtime for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: onecx-playwright:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise runtime and inherited launcher
        run: |
          docker build -f tests/Dockerfile -t onecx-playwright-smoke:local .
          test "$(docker image inspect onecx-playwright:local --format '{{index .Config.Labels "org.onecx.playwright.contract"}}')" = 1
          sh tests/launcher.sh
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(docker image inspect onecx-playwright:local --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          test "${GITHUB_REF_NAME#v}" = "$version"
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated runtime
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true
