name: Reusable OneCX integration tests

on:
  workflow_call:
    inputs:
      environment:
        description: Caller repository environment providing secrets, variables, and protection rules
        type: string
        default: integration
      config-path:
        type: string
        default: integration/integration.config.json
      orchestrator-image:
        description: Published orchestrator image pinned to a release tag or digest
        type: string
        required: true
      e2e-image:
        type: string
        default: ''
      max-parallel:
        type: number
        default: 2
      upload-private-artifacts:
        description: Explicit opt-in to publish package-captured private artifacts (may contain sensitive data)
        type: boolean
        default: false
      docker-registry:
        description: Registry used by all private images; omit credentials for public images
        type: string
        default: ghcr.io
    secrets:
      ENVIRONMENTS_JSON:
        required: false
      TEST_DATA_JSON:
        required: false
      DOCKER_AUTH_CONFIG:
        description: Docker config.json contents for all required private registries
        required: false
      environments-json:
        required: false
      test-data-json:
        required: false
      docker-username:
        required: false
      docker-password:
        required: false

permissions:
  contents: read

env:
  ORCHESTRATOR_IMAGE: ${{ inputs.orchestrator-image }}
  CONFIG_PATH: ${{ inputs.config-path }}
  E2E_IMAGE: ${{ inputs.e2e-image }}
  DOCKER_AUTH_USER: ${{ secrets.docker-username }}
  DOCKER_CONFIG: ${{ github.workspace }}/.onecx-ci/docker

jobs:
  matrix:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      ORCHESTRATOR_IMAGE: ${{ inputs.orchestrator-image || vars.ORCHESTRATOR_IMAGE }}
      E2E_IMAGE: ${{ inputs.e2e-image || vars.E2E_IMAGE }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure explicit Docker authentication
        shell: bash
        env:
          DOCKER_AUTH_CONFIG: ${{ secrets.DOCKER_AUTH_CONFIG }}
        run: |
          if [ -n "$DOCKER_AUTH_CONFIG" ]; then
            umask 077
            mkdir -p "$DOCKER_CONFIG"
            printf '%s' "$DOCKER_AUTH_CONFIG" > "$DOCKER_CONFIG/config.json"
          fi
      - uses: docker/login-action@v3
        if: env.DOCKER_AUTH_USER != ''
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ secrets.docker-username }}
          password: ${{ secrets.docker-password }}
      - name: Extract version-matched shared launcher
        shell: bash
        run: |
          mkdir -p .onecx-ci
          docker pull "$ORCHESTRATOR_IMAGE"
          id=$(docker create "$ORCHESTRATOR_IMAGE")
          trap 'docker rm -f "$id" >/dev/null' EXIT
          docker cp "$id:/opt/onecx-orchestrator/workflow-launch.sh" .onecx-ci/launch.sh
      - name: Resolve matrix
        id: matrix
        shell: bash
        run: |
          sh .onecx-ci/launch.sh matrix
          node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(".onecx-ci/matrix.json"));if(!Array.isArray(m.include)||m.include.length===0)throw Error("Empty integration matrix");fs.appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify(m)}\n`)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-matrix-index
          path: results/matrix-index-input.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove local Docker credentials
        if: always()
        run: rm -f "$DOCKER_CONFIG/config.json"

  run:
    needs: matrix
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      ORCHESTRATOR_IMAGE: ${{ inputs.orchestrator-image || vars.ORCHESTRATOR_IMAGE }}
      E2E_IMAGE: ${{ inputs.e2e-image || vars.E2E_IMAGE }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure explicit Docker authentication
        shell: bash
        env:
          DOCKER_AUTH_CONFIG: ${{ secrets.DOCKER_AUTH_CONFIG }}
        run: |
          if [ -n "$DOCKER_AUTH_CONFIG" ]; then
            umask 077
            mkdir -p "$DOCKER_CONFIG"
            printf '%s' "$DOCKER_AUTH_CONFIG" > "$DOCKER_CONFIG/config.json"
          fi
      - uses: docker/login-action@v3
        if: env.DOCKER_AUTH_USER != ''
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ secrets.docker-username }}
          password: ${{ secrets.docker-password }}
      - name: Extract version-matched shared launcher
        shell: bash
        run: |
          mkdir -p .onecx-ci
          docker pull "$ORCHESTRATOR_IMAGE"
          id=$(docker create "$ORCHESTRATOR_IMAGE")
          trap 'docker rm -f "$id" >/dev/null' EXIT
          docker cp "$id:/opt/onecx-orchestrator/workflow-launch.sh" .onecx-ci/launch.sh
      - name: Run selected platform
        env:
          RUN_ID: ${{ matrix.runId }}
          MATRIX_SELECTION_BASE64: ${{ matrix.selectionBase64 }}
          ENVIRONMENTS_JSON: ${{ secrets.ENVIRONMENTS_JSON || secrets.environments-json }}
          TEST_DATA_JSON: ${{ secrets.TEST_DATA_JSON || secrets.test-data-json }}
        run: sh .onecx-ci/launch.sh run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-run-${{ matrix.runId }}
          path: |
            results/**/summary.json
            results/**/versions.json
            results/**/execution.json
            results/**/allure-results/**
            results/**/allure-report/**
          if-no-files-found: warn
          retention-days: 7
      - name: Upload explicitly enabled private artifacts
        if: always() && inputs.upload-private-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: private-integration-run-${{ matrix.runId }}
          path: |
            results/**/private/**
            results/**/private-artifacts/**
          if-no-files-found: warn
          retention-days: 7
      - name: Remove local Docker credentials
        if: always()
        run: rm -f "$DOCKER_CONFIG/config.json"

  report:
    if: always() && needs.matrix.result == 'success'
    needs: [matrix, run]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      ORCHESTRATOR_IMAGE: ${{ inputs.orchestrator-image || vars.ORCHESTRATOR_IMAGE }}
      E2E_IMAGE: ${{ inputs.e2e-image || vars.E2E_IMAGE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure explicit Docker authentication
        shell: bash
        env:
          DOCKER_AUTH_CONFIG: ${{ secrets.DOCKER_AUTH_CONFIG }}
        run: |
          if [ -n "$DOCKER_AUTH_CONFIG" ]; then
            umask 077
            mkdir -p "$DOCKER_CONFIG"
            printf '%s' "$DOCKER_AUTH_CONFIG" > "$DOCKER_CONFIG/config.json"
          fi
      - uses: docker/login-action@v3
        if: env.DOCKER_AUTH_USER != ''
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ secrets.docker-username }}
          password: ${{ secrets.docker-password }}
      - uses: actions/download-artifact@v4
        with:
          pattern: integration-*
          path: results
          merge-multiple: true
      - name: Extract version-matched shared launcher
        shell: bash
        run: |
          mkdir -p .onecx-ci
          docker pull "$ORCHESTRATOR_IMAGE"
          id=$(docker create "$ORCHESTRATOR_IMAGE")
          trap 'docker rm -f "$id" >/dev/null' EXIT
          docker cp "$id:/opt/onecx-orchestrator/workflow-launch.sh" .onecx-ci/launch.sh
      - name: Build combined report
        run: sh .onecx-ci/launch.sh report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report
          path: |
            results/**/summary.json
            results/**/versions.json
            results/**/execution.json
            results/**/allure-results/**
            results/**/allure-report/**
            results/matrix-index-input.json
            results/matrix-index.json
            results/combined-allure-report/**
          if-no-files-found: warn
          retention-days: 7
      - name: Remove local Docker credentials
        if: always()
        run: rm -f "$DOCKER_CONFIG/config.json"
